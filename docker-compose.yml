services:
  app:
    image: app
    build:
      context: ./
      target: dev
    working_dir: /app/
    env_file:
      - .env
    ports:
      - 3000:3000
    command: bun run dev
    volumes:
      - ./:/app/
      - /app/node_modules/

  prodapp:
    image: prodapp
    build:
      context: ./
      target: release
    working_dir: /app/
    env_file:
      - .env
    ports:
      - 3000:3000
